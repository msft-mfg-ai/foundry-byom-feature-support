name: Feature - routing-apim-anthropic

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/routing-apim-anthropic/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-routing-apim-anthropic.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: routing-apim-anthropic
    secrets: inherit

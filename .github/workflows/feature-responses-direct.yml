name: Feature - responses-direct

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/responses-direct/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-responses-direct.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: responses-direct
    secrets: inherit

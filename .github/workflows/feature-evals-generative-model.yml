name: Feature - evals-generative-model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/evals-generative-model/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-evals-generative-model.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: evals-generative-model
      extras: eval
    secrets: inherit

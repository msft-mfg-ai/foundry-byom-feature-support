name: Feature test (reusable)

on:
  workflow_call:
    inputs:
      feature:
        description: Feature slug (folder under features/)
        required: true
        type: string
      environment:
        description: GitHub environment to pull variables/secrets from
        required: false
        type: string
        default: byom
      runner:
        description: Runner label (override with a self-hosted runner for private-networking environments)
        required: false
        type: string
        default: ubuntu-latest

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run feature test - ${{ inputs.feature }}
        env:
          PROJECT_ENDPOINT: ${{ vars.PROJECT_ENDPOINT }}
          FOUNDRY_ACCOUNT_ENDPOINT: ${{ vars.FOUNDRY_ACCOUNT_ENDPOINT }}
          FOUNDRY_REGION: ${{ vars.FOUNDRY_REGION }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          REASONING_MODEL: ${{ vars.REASONING_MODEL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          # ---- Gateway connections (BYOM routing) ----
          AI_GATEWAY_CONNECTION_STATIC: ${{ vars.AI_GATEWAY_CONNECTION_STATIC }}
          AI_GATEWAY_CONNECTION_DYNAMIC: ${{ vars.AI_GATEWAY_CONNECTION_DYNAMIC }}
          AI_GATEWAY_CONNECTION_ANTHROPIC: ${{ vars.AI_GATEWAY_CONNECTION_ANTHROPIC }}
          AI_GATEWAY_CONNECTION_MODELGATEWAY: ${{ vars.AI_GATEWAY_CONNECTION_MODELGATEWAY }}
          AI_GATEWAY_CONNECTION_SERVERLESS: ${{ vars.AI_GATEWAY_CONNECTION_SERVERLESS }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MODELGATEWAY_MODEL: ${{ vars.MODELGATEWAY_MODEL }}
          SERVERLESS_MODEL: ${{ vars.SERVERLESS_MODEL }}
          # ---- Pre-deployed agents ----
          PROMPT_AGENT_NAME_STATIC: ${{ vars.PROMPT_AGENT_NAME_STATIC }}
          PROMPT_AGENT_NAME_DYNAMIC: ${{ vars.PROMPT_AGENT_NAME_DYNAMIC }}
          HOSTED_AGENT_NAME_STATIC: ${{ vars.HOSTED_AGENT_NAME_STATIC }}
          HOSTED_AGENT_NAME_DYNAMIC: ${{ vars.HOSTED_AGENT_NAME_DYNAMIC }}
          # ---- Tool connections / params ----
          BING_CONNECTION_ID: ${{ vars.BING_CONNECTION_ID }}
          FILE_SEARCH_VECTOR_STORE_ID: ${{ vars.FILE_SEARCH_VECTOR_STORE_ID }}
          AZURE_AI_SEARCH_CONNECTION_ID: ${{ vars.AZURE_AI_SEARCH_CONNECTION_ID }}
          AZURE_AI_SEARCH_INDEX_NAME: ${{ vars.AZURE_AI_SEARCH_INDEX_NAME }}
          SHAREPOINT_CONNECTION_ID: ${{ vars.SHAREPOINT_CONNECTION_ID }}
          FABRIC_CONNECTION_ID: ${{ vars.FABRIC_CONNECTION_ID }}
          A2A_REMOTE_AGENT_ENDPOINT: ${{ vars.A2A_REMOTE_AGENT_ENDPOINT }}
          LOGIC_APP_RESOURCE_ID: ${{ vars.LOGIC_APP_RESOURCE_ID }}
          LOGIC_APP_WORKFLOW_NAME: ${{ vars.LOGIC_APP_WORKFLOW_NAME }}
          COMPUTER_USE_ENVIRONMENT: ${{ vars.COMPUTER_USE_ENVIRONMENT }}
          IMAGE_DEPLOYMENT_NAME: ${{ vars.IMAGE_DEPLOYMENT_NAME }}
          # ---- MCP servers ----
          MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
          MCP_SERVER_URL_AGENT_IDENTITY: ${{ vars.MCP_SERVER_URL_AGENT_IDENTITY }}
          MCP_SERVER_URL_OAUTH: ${{ vars.MCP_SERVER_URL_OAUTH }}
          FOUNDRY_IQ_MCP_URL: ${{ vars.FOUNDRY_IQ_MCP_URL }}
          WORK_IQ_MCP_URL: ${{ vars.WORK_IQ_MCP_URL }}
          WEB_IQ_MCP_URL: ${{ vars.WEB_IQ_MCP_URL }}
          FABRIC_IQ_MCP_URL: ${{ vars.FABRIC_IQ_MCP_URL }}
          # ---- Quality / safety ----
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
          RED_TEAM_TARGET_MODEL: ${{ vars.RED_TEAM_TARGET_MODEL }}
        run: uv run python features/${{ inputs.feature }}/test.py

name: Feature - chat-completions-web-search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/chat-completions-web-search/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-chat-completions-web-search.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: chat-completions-web-search
    secrets: inherit

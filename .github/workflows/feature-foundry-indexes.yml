name: Feature - foundry-indexes

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/foundry-indexes/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-foundry-indexes.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: foundry-indexes
    secrets: inherit

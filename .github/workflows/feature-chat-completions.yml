name: Feature - chat-completions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/chat-completions/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-chat-completions.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: chat-completions
    secrets: inherit

name: Ephemeral E2E - provision, test, teardown

# ─────────────────────────────────────────────────────────────────────────────
# Spins up a fresh `ai-gateway-pe-testing` deployment from
# msft-mfg-ai/ai-foundry-deployment-options, runs the full BYOM feature
# matrix against it, then tears the infra down (with account purge).
#
# Prereqs in the `byom` GitHub Environment:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   vars:
#     AZURE_ENV_NAME           deterministic token (e.g. "byomtest")
#     AZURE_LOCATION           e.g. "eastus2"
#     EXISTING_FOUNDRY_RESOURCE_IDS  ; or OPENAI_RESOURCE_ID — backing Foundry
#                              instance the gateway points at (must have gpt-4o-mini)
#     CHAT_MODEL               defaults to gpt-4o-mini
#
# The CI service principal needs Contributor + User Access Administrator on
# the target subscription (or at least the target RG) to run `azd up` and
# create role assignments inside the deployment.
#
# The `test` job needs a self-hosted runner with line-of-sight into the
# freshly-deployed VNet. Pass its label via the `runner` input.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label for the test job (needs VNet line-of-sight)'
        required: false
        type: string
        default: self-hosted
      teardown:
        description: 'Tear down infra after tests'
        required: false
        type: boolean
        default: true
      environment:
        description: 'GitHub environment to pull secrets/vars from'
        required: false
        type: string
        default: byom
      deployment_options_ref:
        description: 'Ref of msft-mfg-ai/ai-foundry-deployment-options to check out'
        required: false
        type: string
        default: main
  schedule:
    # Weekly on Saturdays at 06:00 UTC — infra is created, tests run, teardown.
    - cron: '0 6 * * 6'

permissions:
  id-token: write
  contents: read

env:
  DEPLOY_REPO: msft-mfg-ai/ai-foundry-deployment-options
  INFRA_PATH: options-infra/ai-gateway-pe-testing

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. Provision the ephemeral infra with azd.
  # ────────────────────────────────────────────────────────────────
  provision:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'byom' }}
    outputs:
      resource_group: ${{ steps.outputs.outputs.resource_group }}
      foundry_name: ${{ steps.outputs.outputs.foundry_name }}
      project_endpoint: ${{ steps.outputs.outputs.project_endpoint }}
      static_conn: ${{ steps.outputs.outputs.static_conn }}
      dynamic_conn: ${{ steps.outputs.outputs.dynamic_conn }}
      slugs: ${{ steps.discover.outputs.slugs }}
    steps:
      - name: Checkout this repo (for feature discovery)
        uses: actions/checkout@v4

      - name: Checkout deployment options
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ inputs.deployment_options_ref || 'main' }}
          path: deployment-options

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: azd up
        working-directory: deployment-options/${{ env.INFRA_PATH }}
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          EXISTING_FOUNDRY_RESOURCE_IDS: ${{ vars.EXISTING_FOUNDRY_RESOURCE_IDS }}
          OPENAI_RESOURCE_ID: ${{ vars.OPENAI_RESOURCE_ID }}
        run: |
          set -euo pipefail
          # Non-interactive azd auth uses the federated OIDC login above.
          azd env new "${AZURE_ENV_NAME}" --location "${AZURE_LOCATION}" --subscription "${AZURE_SUBSCRIPTION_ID}" --no-prompt || \
            azd env select "${AZURE_ENV_NAME}"
          azd up --no-prompt

      - name: Capture outputs
        id: outputs
        working-directory: deployment-options/${{ env.INFRA_PATH }}
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
        run: |
          set -euo pipefail
          get() { azd env get-value "$1" 2>/dev/null || true; }
          RG=$(get RESOURCE_GROUP)
          FN=$(get FOUNDRY_NAME)
          PE=$(get PROJECT_ENDPOINT)
          SC=$(get AI_GATEWAY_CONNECTION_STATIC)
          DC=$(get AI_GATEWAY_CONNECTION_DYNAMIC)
          # Fallback to deterministic names if outputs aren't wired.
          TOKEN="${AZURE_ENV_NAME:-byomtest}"
          SC="${SC:-apim-${TOKEN}-openai-s-for-ai-project-${TOKEN}-1}"
          DC="${DC:-apim-${TOKEN}-openai-d-for-ai-project-${TOKEN}-1}"
          {
            echo "resource_group=$RG"
            echo "foundry_name=$FN"
            echo "project_endpoint=$PE"
            echo "static_conn=$SC"
            echo "dynamic_conn=$DC"
          } >> "$GITHUB_OUTPUT"
          echo "── Provisioned ──"
          echo "RG=$RG  FOUNDRY=$FN"
          echo "PROJECT_ENDPOINT=$PE"
          echo "STATIC=$SC"
          echo "DYNAMIC=$DC"

      - name: Discover feature slugs
        id: discover
        run: |
          slugs=$(find features -mindepth 2 -maxdepth 2 -name test.py \
                  -printf '%h\n' | sed 's|features/||' | sort | jq -R . | jq -s -c .)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────
  # 2. Run every feature sequentially against the ephemeral infra.
  # ────────────────────────────────────────────────────────────────
  test:
    needs: provision
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    environment: ${{ inputs.environment || 'byom' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        feature: ${{ fromJson(needs.provision.outputs.slugs) }}
    env:
      PROJECT_ENDPOINT: ${{ needs.provision.outputs.project_endpoint }}
      AI_GATEWAY_CONNECTION_STATIC: ${{ needs.provision.outputs.static_conn }}
      AI_GATEWAY_CONNECTION_DYNAMIC: ${{ needs.provision.outputs.dynamic_conn }}
      CHAT_MODEL: ${{ vars.CHAT_MODEL || 'gpt-4o-mini' }}
      REASONING_MODEL: ${{ vars.REASONING_MODEL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      RED_TEAM_TARGET_MODEL: ${{ vars.RED_TEAM_TARGET_MODEL }}
      IMAGE_DEPLOYMENT_NAME: ${{ vars.IMAGE_DEPLOYMENT_NAME }}
      HOSTED_AGENT_NAME_STATIC: ${{ vars.HOSTED_AGENT_NAME_STATIC }}
      HOSTED_AGENT_NAME_DYNAMIC: ${{ vars.HOSTED_AGENT_NAME_DYNAMIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run feature - ${{ matrix.feature }}
        run: uv run pytest features/${{ matrix.feature }} -v --tb=short

  # ────────────────────────────────────────────────────────────────
  # 3. Teardown — runs even on failure so we don't leak resources.
  # ────────────────────────────────────────────────────────────────
  teardown:
    needs: [provision, test]
    if: ${{ always() && (inputs.teardown == null || inputs.teardown == true) && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'byom' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ inputs.deployment_options_ref || 'main' }}
          path: deployment-options

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: azd down --purge
        working-directory: deployment-options/${{ env.INFRA_PATH }}
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
        continue-on-error: true
        run: |
          set -euo pipefail
          azd env select "${AZURE_ENV_NAME}" || true
          azd down --purge --force --no-prompt

      - name: Purge soft-deleted Foundry account
        env:
          FOUNDRY_NAME: ${{ needs.provision.outputs.foundry_name }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${FOUNDRY_NAME}" ]; then
            az cognitiveservices account purge \
              --name "${FOUNDRY_NAME}" \
              --resource-group "${{ needs.provision.outputs.resource_group }}" \
              --location "${AZURE_LOCATION}" || echo "Purge failed or account not soft-deleted."
          fi

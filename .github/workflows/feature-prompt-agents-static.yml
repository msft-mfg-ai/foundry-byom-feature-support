name: Feature - prompt-agents-static

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/prompt-agents-static/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-prompt-agents-static.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: prompt-agents-static
    secrets: inherit

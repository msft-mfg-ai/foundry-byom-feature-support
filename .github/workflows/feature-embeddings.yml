name: Feature - embeddings

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/embeddings/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-embeddings.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: embeddings
    secrets: inherit

name: Feature - video-generation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/video-generation/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-video-generation.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: video-generation
    secrets: inherit

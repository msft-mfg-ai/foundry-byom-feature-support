name: Feature - tool-web-search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/tool-web-search/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-tool-web-search.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: tool-web-search
    secrets: inherit

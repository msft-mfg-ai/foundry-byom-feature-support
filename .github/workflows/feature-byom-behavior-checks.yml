name: Feature - byom-behavior-checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/byom-behavior-checks/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-byom-behavior-checks.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: byom-behavior-checks
    secrets: inherit

name: Feature - tool-functions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/tool-functions/**'
      - 'features/_shared.py'
      - 'features/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-tool-functions.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: tool-functions
    secrets: inherit

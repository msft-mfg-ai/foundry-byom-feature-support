name: Feature - batch-api

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/batch-api/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-batch-api.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: batch-api
    secrets: inherit

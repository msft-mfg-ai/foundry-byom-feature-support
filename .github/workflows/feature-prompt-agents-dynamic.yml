name: Feature - prompt-agents-dynamic

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/prompt-agents-dynamic/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-prompt-agents-dynamic.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: prompt-agents-dynamic
    secrets: inherit

name: Feature - llm-translation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/llm-translation/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-llm-translation.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: llm-translation
    secrets: inherit

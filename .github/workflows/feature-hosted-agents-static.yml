name: Feature - hosted-agents-static

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/hosted-agents-static/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-hosted-agents-static.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: hosted-agents-static
    secrets: inherit

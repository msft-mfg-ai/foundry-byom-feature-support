name: Feature - fine-tuning-graders

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/fine-tuning-graders/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-fine-tuning-graders.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: fine-tuning-graders
    secrets: inherit

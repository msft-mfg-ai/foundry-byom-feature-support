name: Feature - tool-web-search-openai

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/tool-web-search-openai/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-tool-web-search-openai.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: tool-web-search-openai
    secrets: inherit

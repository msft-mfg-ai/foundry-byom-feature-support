name: Feature - hosted-agents-dynamic

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/hosted-agents-dynamic/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-hosted-agents-dynamic.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: hosted-agents-dynamic
    secrets: inherit

name: Feature - realtime-transcription

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/realtime-transcription/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-realtime-transcription.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: realtime-transcription
    secrets: inherit

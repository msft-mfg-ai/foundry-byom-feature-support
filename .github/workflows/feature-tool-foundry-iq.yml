name: Feature - tool-foundry-iq

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/tool-foundry-iq/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-tool-foundry-iq.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: tool-foundry-iq
    secrets: inherit

name: Feature - reasoning-models-byom

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/reasoning-models-byom/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-reasoning-models-byom.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: reasoning-models-byom
    secrets: inherit

name: Feature - responses-inline-moderation

on:
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/responses-inline-moderation/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-responses-inline-moderation.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: responses-inline-moderation
    secrets: inherit

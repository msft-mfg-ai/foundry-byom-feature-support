name: Feature - image-variations

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'features/image-variations/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-image-variations.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: image-variations
    secrets: inherit

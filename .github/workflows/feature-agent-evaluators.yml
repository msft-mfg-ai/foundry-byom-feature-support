name: Feature - agent-evaluators

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/agent-evaluators/**'
      - 'features/_shared.py'
      - 'features/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-agent-evaluators.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: agent-evaluators
    secrets: inherit

name: Feature - tool-a2a

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/tool-a2a/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-tool-a2a.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: tool-a2a
    secrets: inherit

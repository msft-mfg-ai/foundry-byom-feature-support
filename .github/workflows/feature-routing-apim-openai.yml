name: Feature - routing-apim-openai

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/routing-apim-openai/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-routing-apim-openai.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: routing-apim-openai
    secrets: inherit

name: Feature - image-generation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/image-generation/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-image-generation.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: image-generation
    secrets: inherit

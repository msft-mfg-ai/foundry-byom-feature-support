name: Feature - audio-transcription

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/audio-transcription/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-audio-transcription.yml'
      - '.github/workflows/_feature-test.yml'

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: audio-transcription
    secrets: inherit

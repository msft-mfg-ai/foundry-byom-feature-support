name: Feature - agent-a2a-connected

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC
  push:
    branches: [main]
    paths:
      - 'features/agent-a2a-connected/**'
      - 'features/_shared.py'
      - 'pyproject.toml'
      - '.github/workflows/feature-agent-a2a-connected.yml'
      - '.github/workflows/_feature-test.yml'

permissions:
  id-token: write
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_feature-test.yml
    with:
      feature: agent-a2a-connected
    secrets: inherit
